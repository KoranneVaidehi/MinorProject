{% extends "base.html" %}

{% block content %}

<div class="dashboard">

  <span class="dash-badge">⬡ Forensics Dashboard</span>

  <h1>Detect <span>Manipulated</span> Media</h1>

  <p class="dash-desc">
    Upload a photo or video to run AI-powered deepfake and face manipulation analysis.
  </p>

  <p class="dash-welcome">
    Logged in as <strong>{{ user.username }}</strong>
  </p>

  <div class="dash-actions">

    <a href="/upload/">
      <button class="btn-primary">Upload Photo / Video</button>
    </a>

    <a href="/logout/">
      <button class="btn-ghost">Logout</button>
    </a>

  </div>

</div>

{% endblock %}
