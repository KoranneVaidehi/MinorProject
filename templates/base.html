<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERIDEX — Digital Forensics Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ── Variables ── */
:root {
  --bg:          #0d1117;
  --surface:     #161b22;
  --surface-2:   #1c2333;
  --border:      rgba(255,255,255,0.08);
  --accent:      #00d4a8;
  --accent-glow: rgba(0,212,168,0.15);
  --text:        #e6edf3;
  --text-muted:  #8b949e;
  --radius:      10px;
  --nav-h:       66px;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  min-height: 100vh;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: #fff; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }

/* ── Background wrapper ── */
.background-grid {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 70% -10%, rgba(0,212,168,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 10% 100%, rgba(0,212,168,0.04) 0%, transparent 50%),
    var(--bg);
  display: flex;
  flex-direction: column;
}

/* ── Navbar ── */
.navbar {
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,17,23,0.85);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent);
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.logo span {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 3px;
}

.nav-links {
  display: flex;
  gap: 8px;
  align-items: center;
}

.nav-links a {
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.nav-links a:hover {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border);
}

.nav-links a:last-child {
  color: var(--accent);
  border-color: rgba(0,212,168,0.3);
}

.nav-links a:last-child:hover {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Main content ── */
.main-content {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 20px 80px;
}

/* ── Auth Box ── */
.auth-box {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  animation: fadeUp 0.4s ease both;
}

.auth-box h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text);
  margin-bottom: 6px;
}

.auth-accent-line {
  width: 36px;
  height: 3px;
  background: var(--accent);
  border-radius: 2px;
  margin-bottom: 28px;
}

.form-group { margin-bottom: 16px; }

.auth-box label {
  display: block;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 7px;
}

.auth-box input {
  width: 100%;
  padding: 11px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.93rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.auth-box input::placeholder { color: #4a5568; }

.auth-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.auth-footer {
  margin-top: 20px;
  font-size: 0.83rem;
  color: var(--text-muted);
  text-align: center;
}

.auth-footer a { color: var(--accent); font-weight: 500; }

/* ── Buttons ── */
button, .btn {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px 24px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
  display: inline-block;
  text-align: center;
}

button:active, .btn:active { transform: scale(0.97); }

.btn-primary, button[type="submit"], .auth-box button {
  width: 100%;
  background: var(--accent);
  color: #0d1117;
  box-shadow: 0 0 20px rgba(0,212,168,0.2);
  margin-top: 8px;
}

.btn-primary:hover, button[type="submit"]:hover, .auth-box button:hover {
  background: #00f0c0;
  box-shadow: 0 0 28px rgba(0,212,168,0.35);
}

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid rgba(0,212,168,0.4);
}

.btn-ghost:hover {
  background: var(--accent-glow);
  border-color: var(--accent);
}

/* ── Dashboard ── */
.dashboard {
  width: 100%;
  max-width: 720px;
  text-align: center;
  animation: fadeUp 0.4s ease both;
}

.dash-badge {
  display: inline-block;
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-glow);
  border: 1px solid rgba(0,212,168,0.3);
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.dashboard h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(1.9rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 12px;
}

.dashboard h1 span { color: var(--accent); }

.dash-desc {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 36px;
}

.dash-welcome {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 30px;
}

.dash-welcome strong { color: var(--accent); }

.dash-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.dash-actions a button,
.dash-actions a .btn {
  width: auto;
  padding: 13px 32px;
}

/* ── Upload ── */
.upload-box {
  width: 100%;
  max-width: 520px;
  animation: fadeUp 0.4s ease both;
}

.upload-box h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.accent-line {
  width: 36px;
  height: 3px;
  background: var(--accent);
  border-radius: 2px;
  margin-bottom: 28px;
}

.upload-area {
  background: var(--surface);
  border: 1.5px dashed rgba(0,212,168,0.35);
  border-radius: var(--radius);
  padding: 40px 30px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}

.upload-area:hover {
  border-color: var(--accent);
  background: var(--accent-glow);
}

.upload-icon { font-size: 2.4rem; margin-bottom: 12px; }

.upload-area p {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.upload-area input[type="file"] { display: none; }

.file-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid rgba(0,212,168,0.4);
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.file-label:hover { background: var(--accent-glow); }

.selected-file {
  margin-top: 14px;
  font-size: 0.83rem;
  color: var(--text-muted);
}

.upload-box button[type="submit"] { margin-top: 20px; }

.upload-msg {
  margin-top: 16px;
  font-size: 0.88rem;
  color: var(--accent);
  text-align: center;
}

/* ── Result ── */
.result-box {
  width: 100%;
  max-width: 560px;
  animation: fadeUp 0.4s ease both;
}

.result-box h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.result-media {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
}

.result-media img {
  max-width: 100%;
  border-radius: 6px;
  display: block;
  margin: 0 auto;
}

.result-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 20px;
}

.stat-label {
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-value {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.btn-back {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 10px 22px;
  border-radius: 7px;
  display: inline-block;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.btn-back:hover {
  color: var(--text);
  border-color: rgba(255,255,255,0.2);
  background: var(--surface-2);
}

/* ── Home hero ── */
.home-hero {
  text-align: center;
  max-width: 640px;
  animation: fadeUp 0.5s ease both;
}

.hero-badge {
  display: inline-block;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-glow);
  border: 1px solid rgba(0,212,168,0.3);
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 24px;
}

.home-hero h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(2.4rem, 7vw, 4rem);
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 16px;
}

.home-hero h1 span { color: var(--accent); }

.home-hero p {
  font-size: 1rem;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 40px;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
}

.hero-btns {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.hero-btns a button,
.hero-btns a .btn {
  width: auto;
  padding: 13px 34px;
}

/* ── Animation ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .navbar { padding: 0 20px; }
  .main-content { padding: 40px 16px 60px; }
  .auth-box { padding: 28px 22px; }
}
</style>

</head>

<body>

<div class="background-grid">

  <nav class="navbar">

    <div class="logo">
      VERIDEX
      <span>Digital Forensics Lab</span>
    </div>

    <div class="nav-links">

      {% if user.is_authenticated %}
        <a href="/dashboard/">Dashboard</a>
        <a href="/logout/">Logout</a>
      {% else %}
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
      {% endif %}

    </div>

  </nav>

  <div class="main-content">

    {% block content %}
    {% endblock %}

  </div>

</div>

</body>
</html>
