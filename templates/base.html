<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERIDEX — Digital Forensics Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ── Variables ── */
:root {
  --blue-primary:  #2563EB;
  --blue-secondary:#3B82F6;
  --blue-light:    #EFF6FF;
  --blue-mid:      #DBEAFE;
  --bg:            #F8FAFC;
  --surface:       #FFFFFF;
  --surface-2:     #F1F5F9;
  --border:        #E2E8F0;
  --border-focus:  #93C5FD;
  --text:          #0F172A;
  --text-muted:    #475569;
  --text-light:    #94A3B8;
  --radius:        12px;
  --radius-sm:     8px;
  --nav-h:         68px;
  --shadow-sm:     0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:     0 4px 16px rgba(0,0,0,0.07), 0 2px 6px rgba(0,0,0,0.04);
  --shadow-lg:     0 12px 40px rgba(15,23,42,0.10), 0 4px 12px rgba(15,23,42,0.05);
  --shadow-blue:   0 4px 20px rgba(37,99,235,0.18);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--blue-primary); text-decoration: none; }
a:hover { color: var(--blue-secondary); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

/* ── Page wrapper ── */
.page-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 85% 0%, rgba(37,99,235,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 5% 95%, rgba(59,130,246,0.04) 0%, transparent 50%),
    var(--bg);
}

/* ─────────────────── NAVBAR ─────────────────── */
.navbar {
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), var(--shadow-sm);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-icon {
  width: 34px;
  height: 34px;
  background: var(--blue-primary);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-blue);
  flex-shrink: 0;
}

.logo-icon svg {
  width: 18px;
  height: 18px;
  fill: #fff;
}

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--text);
}

.logo-sub {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-top: 2px;
}

.nav-links {
  display: flex;
  gap: 4px;
  align-items: center;
}

.nav-links a {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-muted);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: color 0.18s, background 0.18s, border-color 0.18s;
  text-decoration: none;
}

.nav-links a:hover {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border);
}

.nav-links .nav-btn-primary {
  color: var(--surface);
  background: var(--blue-primary);
  border-color: var(--blue-primary);
  padding: 7px 18px;
  box-shadow: var(--shadow-blue);
}

.nav-links .nav-btn-primary:hover {
  background: #1D4ED8;
  border-color: #1D4ED8;
  color: #fff;
}

/* ── Main content ── */
.main-content {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 64px 24px 96px;
}

/* ─────────────────── AUTH BOX ─────────────────── */
.auth-box {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 44px 40px;
  box-shadow: var(--shadow-lg);
  animation: fadeUp 0.4s ease both;
}

.auth-box-header {
  margin-bottom: 32px;
}

.auth-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--blue-primary);
  background: var(--blue-light);
  border: 1px solid var(--blue-mid);
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 14px;
}

.auth-box h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.auth-box .auth-sub {
  font-size: 0.875rem;
  color: var(--text-muted);
  line-height: 1.55;
}

/* Form elements */
.form-group { margin-bottom: 18px; }

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon {
  position: absolute;
  left: 13px;
  width: 17px;
  height: 17px;
  color: var(--text-light);
  pointer-events: none;
  flex-shrink: 0;
}

.input-wrapper input,
.auth-box input:not([type="file"]),
.form-group input:not([type="file"]) {
  width: 100%;
  padding: 11px 14px 11px 40px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.93rem;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
}

.input-wrapper input::placeholder,
.auth-box input::placeholder {
  color: var(--text-light);
}

.input-wrapper input:focus,
.auth-box input:focus {
  border-color: var(--blue-secondary);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* no icon variant */
.no-icon input {
  padding-left: 14px;
}

.auth-divider {
  height: 1px;
  background: var(--border);
  margin: 24px 0;
}

.auth-footer {
  margin-top: 22px;
  font-size: 0.86rem;
  color: var(--text-muted);
  text-align: center;
}

.auth-footer a {
  color: var(--blue-primary);
  font-weight: 600;
}

/* ─────────────────── BUTTONS ─────────────────── */
button, .btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.94rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 12px 26px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  line-height: 1;
}

button:active, .btn:active { transform: scale(0.98); }

.btn-primary,
button[type="submit"],
.auth-box button {
  width: 100%;
  background: var(--blue-primary);
  color: #fff;
  box-shadow: var(--shadow-blue);
  margin-top: 8px;
  border: 1.5px solid transparent;
}

.btn-primary:hover,
button[type="submit"]:hover,
.auth-box button:hover {
  background: #1D4ED8;
  box-shadow: 0 6px 24px rgba(37,99,235,0.28);
  transform: translateY(-1px);
}

.btn-outline {
  background: var(--surface);
  color: var(--blue-primary);
  border: 1.5px solid var(--blue-primary);
  box-shadow: none;
}

.btn-outline:hover {
  background: var(--blue-light);
  box-shadow: none;
  transform: translateY(-1px);
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1.5px solid var(--border);
}

.btn-ghost:hover {
  background: var(--surface-2);
  border-color: #CBD5E1;
  color: var(--text);
}

.btn-sm {
  padding: 9px 18px;
  font-size: 0.85rem;
}

/* ─────────────────── DASHBOARD ─────────────────── */
.dashboard {
  width: 100%;
  max-width: 820px;
  animation: fadeUp 0.4s ease both;
}

.page-header {
  margin-bottom: 40px;
}

.page-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--blue-primary);
  background: var(--blue-light);
  border: 1px solid var(--blue-mid);
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
}

.page-header h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.75rem, 4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 10px;
}

.page-header h1 span { color: var(--blue-primary); }

.page-header p {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.65;
  max-width: 560px;
}

.dash-welcome-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 22px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
}

.dash-avatar {
  width: 38px;
  height: 38px;
  background: var(--blue-light);
  border: 2px solid var(--blue-mid);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--blue-primary);
  flex-shrink: 0;
}

.dash-welcome-text {
  font-size: 0.9rem;
  color: var(--text-muted);
}

.dash-welcome-text strong {
  color: var(--text);
  font-weight: 600;
}

.dash-welcome-text span {
  color: var(--blue-primary);
  font-weight: 600;
}

.dash-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.dash-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 22px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
}

.dash-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: #CBD5E1;
}

.dash-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  font-size: 20px;
}

.icon-blue { background: var(--blue-light); }
.icon-green { background: #F0FDF4; }
.icon-purple { background: #FAF5FF; }

.dash-card h3 {
  font-family: 'Syne', sans-serif;
  font-size: 0.97rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.dash-card p {
  font-size: 0.845rem;
  color: var(--text-muted);
  line-height: 1.55;
}

.dash-actions-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.dash-actions-row a {
  text-decoration: none;
}

.dash-actions-row a button,
.dash-actions-row a .btn {
  width: auto;
  padding: 13px 30px;
}

/* ─────────────────── UPLOAD ─────────────────── */
.upload-box {
  width: 100%;
  max-width: 560px;
  animation: fadeUp 0.4s ease both;
}

.upload-box h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 6px;
}

.section-line {
  width: 36px;
  height: 3px;
  background: var(--blue-primary);
  border-radius: 2px;
  margin-bottom: 28px;
}

.upload-area {
  background: var(--surface);
  border: 2px dashed var(--border-focus);
  border-radius: var(--radius);
  padding: 44px 30px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  cursor: pointer;
  position: relative;
}

.upload-area:hover {
  border-color: var(--blue-secondary);
  background: var(--blue-light);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
}

.upload-area.dragover {
  border-color: var(--blue-primary);
  background: var(--blue-light);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
}

.upload-icon-wrap {
  width: 64px;
  height: 64px;
  background: var(--blue-light);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
  border: 1px solid var(--blue-mid);
}

.upload-icon-wrap svg {
  width: 28px;
  height: 28px;
  color: var(--blue-primary);
}

.upload-area h3 {
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.upload-area p {
  font-size: 0.86rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.upload-area input[type="file"] { display: none; }

.file-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--blue-primary);
  background: var(--surface);
  border: 1.5px solid var(--blue-primary);
  padding: 9px 22px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.18s, box-shadow 0.18s;
  display: inline-block;
}

.file-label:hover {
  background: var(--blue-light);
  box-shadow: var(--shadow-blue);
}

.selected-file {
  margin-top: 16px;
  font-size: 0.84rem;
  color: var(--blue-primary);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 22px;
}

.upload-formats {
  font-size: 0.78rem;
  color: var(--text-light);
  margin-top: 8px;
}

.upload-box button[type="submit"] { margin-top: 22px; }

.upload-msg {
  margin-top: 16px;
  font-size: 0.88rem;
  color: var(--blue-primary);
  background: var(--blue-light);
  border: 1px solid var(--blue-mid);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  text-align: center;
}

/* ─────────────────── RESULT ─────────────────── */
.result-box {
  width: 100%;
  max-width: 900px;
  animation: fadeUp 0.4s ease both;
}

.result-box h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

/* Summary strip */
.result-summary {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 28px;
  align-items: stretch;
}

.result-stat-card {
  flex: 1;
  min-width: 150px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  border-top: 3px solid var(--blue-primary);
}

.result-stat-card .stat-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 6px;
}

.result-stat-card .stat-value {
  font-family: 'Syne', sans-serif;
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--blue-primary);
  line-height: 1;
}

.prediction-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
  margin-top: 8px;
}

.badge-real {
  color: #15803D;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
}

.badge-fake {
  color: #B91C1C;
  background: #FEF2F2;
  border: 1px solid #FECACA;
}

/* Side-by-side images */
.result-images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 28px;
}

.result-image-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.result-image-label {
  padding: 12px 16px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.result-image-label .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-blue { background: var(--blue-primary); }
.dot-orange { background: #F97316; }

.result-image-card img {
  display: block;
  width: 100%;
  height: 280px;
  object-fit: cover;
}

/* Result action row */
.result-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.result-actions a { text-decoration: none; }

.btn-back {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  border: 1.5px solid var(--border);
  padding: 10px 22px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.18s, border-color 0.18s, background 0.18s;
  background: var(--surface);
  cursor: pointer;
}

.btn-back:hover {
  color: var(--text);
  border-color: #CBD5E1;
  background: var(--surface-2);
}

/* ─────────────────── HOME HERO ─────────────────── */
.home-hero {
  text-align: center;
  max-width: 700px;
  animation: fadeUp 0.5s ease both;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blue-primary);
  background: var(--blue-light);
  border: 1px solid var(--blue-mid);
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 24px;
}

.home-hero h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.08;
  color: var(--text);
  margin-bottom: 18px;
}

.home-hero h1 span { color: var(--blue-primary); }

.home-hero p {
  font-size: 1.05rem;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 40px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.hero-btns {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 64px;
}

.hero-btns a { text-decoration: none; }

.hero-btns button,
.hero-btns .btn {
  width: auto;
  padding: 14px 36px;
  font-size: 0.97rem;
}

/* Trust bar */
.trust-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 64px;
}

.trust-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.trust-number {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--blue-primary);
}

.trust-label {
  font-size: 0.78rem;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}

/* Feature cards */
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
}

.feature-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.2s;
}

.feature-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.feature-icon {
  width: 42px;
  height: 42px;
  background: var(--blue-light);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-size: 20px;
}

.feature-card h4 {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.feature-card p {
  font-size: 0.83rem;
  color: var(--text-muted);
  line-height: 1.55;
  margin-bottom: 0;
}

/* ─────────────────── FOOTER ─────────────────── */
.site-footer {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 28px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.footer-brand {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--blue-primary);
}

.footer-copy {
  font-size: 0.8rem;
  color: var(--text-light);
}

/* ─────────────────── ANIMATIONS ─────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─────────────────── RESPONSIVE ─────────────────── */
@media (max-width: 768px) {
  .navbar { padding: 0 20px; }
  .main-content { padding: 40px 16px 64px; }
  .auth-box { padding: 32px 24px; }
  .result-images { grid-template-columns: 1fr; }
  .site-footer { padding: 24px 20px; flex-direction: column; align-items: flex-start; }
  .upload-box { max-width: 100%; }
}

@media (max-width: 480px) {
  .logo-sub { display: none; }
  .hero-btns button, .hero-btns .btn { padding: 13px 26px; }
  .trust-bar { gap: 20px; }
}
</style>

</head>
<body>

<div class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="navbar">

    <a href="/" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">VERIDEX</span>
        <span class="logo-sub">Digital Forensics Lab</span>
      </div>
    </a>

    <div class="nav-links">
      {% if user.is_authenticated %}
        <a href="/dashboard/">Dashboard</a>
        <a href="/logout/" class="nav-btn-primary">Logout</a>
      {% else %}
        <a href="/login/">Login</a>
        <a href="/register/" class="nav-btn-primary">Get Started</a>
      {% endif %}
    </div>

  </nav>

  <!-- PAGE CONTENT -->
  <div class="main-content">
    {% block content %}
    {% endblock %}
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <span class="footer-brand">VERIDEX</span>
    <span class="footer-copy">© 2025 VERIDEX Digital Forensics Lab. All rights reserved.</span>
  </footer>

</div>

</body>
</html>
