{% extends "base.html" %}

{% block content %}

<div class="upload-box">

  <h2>Upload Media</h2>
  <div class="section-line"></div>

  <form method="POST" enctype="multipart/form-data" id="uploadForm">
    {% csrf_token %}

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">

      <div class="upload-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>

      <h3>Drop your file here</h3>
      <p>or click to browse from your device</p>

      <span class="file-label" onclick="event.stopPropagation()">
        <label for="fileInput" style="cursor:pointer;">Browse Files</label>
      </span>

      <input type="file" id="fileInput" name="file" accept="image/*,video/*"
             onchange="handleFileSelect(this)">

      <p class="upload-formats">Supported: JPG, PNG, MP4, MOV, AVI — Max 50 MB</p>

    </div>

    <p class="selected-file" id="fileName"></p>

    <button type="submit" id="submitBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Analyse File
    </button>

  </form>

  {% if msg %}
    <div class="upload-msg">{{ msg }}</div>
  {% endif %}

</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileName  = document.getElementById('fileName');
const submitBtn = document.getElementById('submitBtn');

function handleFileSelect(input) {
  const file = input.files[0];
  if (file) {
    fileName.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>
      ${file.name}
    `;
  }
}

// Drag-and-drop
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const dt = e.dataTransfer;
  if (dt.files.length) {
    fileInput.files = dt.files;
    handleFileSelect(fileInput);
  }
});

// Loading state
document.getElementById('uploadForm').addEventListener('submit', () => {
  submitBtn.disabled = true;
  submitBtn.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    Analysing…
  `;
});
</script>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

{% endblock %}
