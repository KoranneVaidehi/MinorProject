{% extends "base.html" %}

{% block content %}

<h2>Upload Photo or Video</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input type="file" name="file">

<button type="submit">Upload</button>

</form>

{% if msg %}
<p>{{msg}}</p>
{% endif %}

{% endblock %}
