{% extends "base.html" %}

{% block content %}

<div class="auth-box">

  <div class="auth-box-header">
    <div class="auth-chip">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="4"/></svg>
      New Account
    </div>
    <h2>Request Access</h2>
    <p class="auth-sub">Create your VERIDEX account to start detecting manipulated media.</p>
  </div>

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Full Name</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" name="username" placeholder="Your full name" required autocomplete="name">
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password">
      </div>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required autocomplete="new-password">
      </div>
    </div>

    <button type="submit">Create Account →</button>

  </form>

  <div class="auth-divider"></div>

  <p class="auth-footer">
    Already registered? <a href="/login/">Sign In</a>
  </p>

</div>

{% endblock %}
