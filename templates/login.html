{% extends "base.html" %}

{% block content %}

<div class="auth-box">

  <div class="auth-box-header">
    <div class="auth-chip">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="4"/></svg>
      Secure Access
    </div>
    <h2>Welcome Back</h2>
    <p class="auth-sub">Sign in to your VERIDEX account to continue your forensic analysis.</p>
  </div>

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
    </div>

    <button type="submit">Access System →</button>

  </form>

  <div class="auth-divider"></div>

  <p class="auth-footer">
    New user? <a href="/register/">Request Access</a>
  </p>

</div>

{% endblock %}
